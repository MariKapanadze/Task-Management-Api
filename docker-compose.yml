services:
  postgres:
    image: postgres:17
    container_name: task-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: task_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_app -d task_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: PostgreSql
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=task_management;Username=task_app;Password=${POSTGRES_PASSWORD}"
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?Set ADMIN_SEED_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: